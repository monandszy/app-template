<!DOCTYPE html>
<html lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout.html}"
      xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Conversations</title>
</head>
<th:block layout:fragment="content" th:fragment="fragment">
  <div id="content" class="conversation-content">
    <div th:replace="~{conversation/sidebar :: fragment}"></div>
    <div th:replace="~{conversation/introduction-window :: fragment}"></div>
    <div th:replace="~{conversation/generate-form :: fragment}"></div>
    <div th:include="~{conversation/generate-form :: script-fragment}"></div>
    <script th:inline="javascript">
      resetGlobal()
    </script>
  </div>
</th:block>
</html>
